services:
  postgres:
    image: postgres:16
    container_name: ipsakti-postgres
    environment:
      POSTGRES_DB: ipsakti
      POSTGRES_USER: ipsakti
      POSTGRES_PASSWORD: ipsakti-dev-pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipsakti"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: ipsakti-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/data

  indictrans2-sidecar:
    build: ../services/indictrans2-sidecar
    container_name: ipsakti-indictrans2-sidecar
    ports:
      - "8600:8600"
    volumes:
      # Persists the downloaded NLLB-200 model across container restarts -
      # without this, every `docker compose up` re-downloads it (~2.4GB).
      - indictrans2_models:/root/.cache/huggingface

volumes:
  postgres_data:
  chromadb_data:
  indictrans2_models:
