# Version-controlled multilingual legal-terminology glossary (task
# Section 5). Every term here is protected from machine translation - MT
# never sees the literal English string, only an opaque placeholder, so it
# can't paraphrase or mistranslate it.
#
# `translations` starts empty for every language on every term: per Section
# 5, "Never invent translations." An entry only gets a localized string
# here once a qualified reviewer has vetted it (see
# docs/multilingual-architecture.md#glossary). Until then, the term is
# rendered in English inline in the localized answer - ambiguous but
# correct beats fluent but wrong for a legal term.
version: 1
terms:
