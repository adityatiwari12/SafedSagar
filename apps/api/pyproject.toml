[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "ipsakti-api"
version = "0.1.0"
description = "IP-SAKTI Sahayak FastAPI + LangGraph RAG assistant backend"
requires-python = ">=3.11"
authors = [
    {name = "IP-SAKTI Team", email = "team@ipsakti.local"}
]

dependencies = [
    "fastapi==0.115.0",
    "sqlalchemy==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.13.1",
    "bcrypt==5.0.0",
    "python-jose[cryptography]==3.4.0",
    "pydantic-settings==2.2.1",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.18",
    "rank-bm25==0.2.2",
    "py3langid==0.4.0",
    "pyyaml==6.0.3",
    "fpdf2==2.8.2",
]
# Deliberately NOT using the `langgraph` package: it pulls langchain-core,
# which pulls uuid_utils (a Rust native extension) - blocked outright by
# this machine's Windows Application Control policy, and older
# langchain-core releases that predate uuid_utils pull other native deps
# (cffi, zstandard) with no prebuilt wheel for Python 3.14 either. The
# actual requirement (CLAUDE.md: "one LangGraph state graph inside a
# single FastAPI service, not eight microservices") is architectural -
# one process, one state machine, sequential named nodes - not a mandate
# for this specific PyPI package. app/graph/graph.py hand-rolls the same
# shape in plain Python with zero extra dependencies.

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.3",
    "httpx==0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
