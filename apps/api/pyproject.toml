[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsakti-api"
version = "0.1.0"
description = "IP-SAKTI Sahayak FastAPI + LangGraph RAG assistant backend"
requires-python = ">=3.11"
authors = [
    {name = "IP-SAKTI Team", email = "team@ipsakti.local"}
]

dependencies = [
    "fastapi==0.115.0",
    "sqlalchemy==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.13.1",
    "bcrypt==5.0.0",
    "python-jose[cryptography]==3.4.0",
    "pydantic-settings==2.2.1",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.3",
    "httpx==0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
