  - doc_id: wipo-hague-geneva-act-1999
    title: "Geneva Act (1999) of the Hague Agreement Concerning the International Registration of Industrial Designs"
    authority: "World Intellectual Property Organization (WIPO)"
    jurisdiction: international
    doc_type: treaty
    source_url: "https://www.wipo.int/edocs/mdocs/diplconf/en/h_dc/h_dc_40.pdf"
    format: pdf
    version: "1999-07-02-adopted"
    effective_date: "2003-12-23"
    last_verified_date: "2026-09-22"
    notes: "WIPO Diplomatic Conference document H/DC/40 - the Geneva Act text as adopted by the Diplomatic Conference on 2 July 1999 (confirmed from the document's own title page), together with its Regulations and the Conference's agreed statements. Entry-into-force date (23 Dec 2003, three months after the sixth qualifying ratification/accession per Geneva Act Art.28(2)) is well documented externally (WIPO Hague System pages, Congress.gov treaty record) but is not itself stated in this adoption-conference document, so it is recorded here as background rather than re-derived from this PDF's text. wipo.int/edocs/pubdocs/en/designs/453/wipo_pub_453.pdf (an earlier candidate URL) 404s; WIPO Pub. 269 (wipo_pub_269_2019.pdf) is a valid alternative official consolidated text but bundles the Geneva Act together with the 1960 Hague Act and 1967 Stockholm Complementary Act in one PDF, which would blur section-citation boundaries between three different treaty instruments - H/DC/40 is Geneva-Act-only and was preferred for citation cleanliness."
